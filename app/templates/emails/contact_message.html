<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New Portfolio Contact Message</title>
</head>
<body style="margin:0; padding:24px; background:#f4f6f8; color:#1f2937; font-family:Arial, sans-serif;">
    <div style="max-width:640px; margin:0 auto; background:#ffffff; border:1px solid #e5e7eb; border-radius:12px; overflow:hidden;">
        <div style="padding:24px 28px; background:#111827; color:#ffffff;">
            <p style="margin:0 0 6px; font-size:12px; font-weight:bold; letter-spacing:1px;">PORTFOLIO</p>
            <h1 style="margin:0; font-size:22px;">New contact message</h1>
        </div>

        <div style="padding:28px;">
            <h2 style="margin:0 0 16px; font-size:16px;">Sender details</h2>

            <table style="width:100%; border-collapse:collapse; font-size:14px;">
                <tr>
                    <td style="width:120px; padding:10px 0; color:#6b7280; border-bottom:1px solid #e5e7eb;">Name</td>
                    <td style="padding:10px 0; font-weight:bold; border-bottom:1px solid #e5e7eb;">{{ sender_name }}</td>
                </tr>
                <tr>
                    <td style="padding:10px 0; color:#6b7280;">Email</td>
                    <td style="padding:10px 0;"><a href="mailto:{{ sender_email }}" style="color:#2563eb;">{{ sender_email }}</a></td>
                </tr>
            </table>

            <h2 style="margin:28px 0 12px; font-size:16px;">Message</h2>
            <div style="padding:16px; background:#f9fafb; border-left:4px solid #2563eb; border-radius:4px; font-size:14px; line-height:1.6; white-space:pre-wrap;">{{ message_text }}</div>
        </div>
    </div>
</body>
</html>
